<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Multi-Entity Office Expenses Command Center</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
</head>
<body class="bg-slate-900 text-slate-100 font-sans min-h-screen" x-data="expenseCenter()">

    <!-- 顶部导航栏 -->
    <header class="bg-slate-800 border-b border-slate-700 shadow-lg sticky top-0 z-50">
        <div class="max-w-7xl mx-auto px-4 py-3 flex flex-col md:flex-row justify-between items-center gap-4">
            <div class="flex items-center gap-3">
                <span class="text-2xl">🏢</span>
                <div>
                    <h1 class="text-lg font-bold tracking-wide" x-text="lang === 'zh' ? '多实体行政费用指挥中心' : 'Multi-Entity Expenses Command Center'"></h1>
                    <p class="text-xs text-slate-400" x-text="lang === 'zh' ? '自动化总账本与智能分类系统' : 'Automated Master Listing & Smart Categorization'"></p>
                </div>
            </div>

            <!-- 控制区：公司选择 & 语言切换 -->
            <div class="flex items-center gap-3">
                <!-- 公司切换 -->
                <select x-model="currentCompany" class="bg-slate-700 border border-slate-600 rounded-lg px-3 py-1.5 text-sm text-slate-200 focus:outline-none focus:ring-2 focus:ring-indigo-500">
                    <option value="BKBP">Black Knight BPO (BKBP)</option>
                    <option value="BSO">BS One Management (BSO)</option>
                    <option value="BRIC">Bricstar Sdn Bhd (BRIC)</option>
                    <option value="BSPD">Paydaes Sdn Bhd (BSPD)</option>
                </select>

                <!-- 语言切换 -->
                <button @click="lang = lang === 'zh' ? 'en' : 'zh'" class="bg-indigo-600 hover:bg-indigo-700 text-white text-xs px-3 py-1.5 rounded-lg transition font-medium">
                    🌐 <span x-text="lang === 'zh' ? 'EN / 中文' : '中文 / EN'"></span>
                </button>
            </div>
        </div>
    </header>

    <main class="max-w-7xl mx-auto px-4 py-6 space-y-6">

        <!-- 统计面板 -->
        <div class="grid grid-cols-1 md:grid-cols-4 gap-4">
            <div class="bg-slate-800 border border-slate-700 p-4 rounded-xl shadow">
                <p class="text-xs text-slate-400" x-text="lang === 'zh' ? '当前公司总开支' : 'Total Expenses'"></p>
                <p class="text-2xl font-bold text-indigo-400 mt-1" x-text="totalAmountFormatted"></p>
            </div>
            <div class="bg-slate-800 border border-slate-700 p-4 rounded-xl shadow">
                <p class="text-xs text-slate-400" x-text="lang === 'zh' ? '总单据笔数' : 'Total Invoices'"></p>
                <p class="text-2xl font-bold text-emerald-400 mt-1" x-text="filteredExpenses.length + ' 笔'"></p>
            </div>
            <div class="bg-slate-800 border border-slate-700 p-4 rounded-xl shadow">
                <p class="text-xs text-slate-400" x-text="lang === 'zh' ? '待核实异常记录' : 'To Be Verified'"></p>
                <p class="text-2xl font-bold text-amber-400 mt-1" x-text="pendingVerifyCount + ' 行'"></p>
            </div>
            <div class="bg-slate-800 border border-slate-700 p-4 rounded-xl shadow">
                <p class="text-xs text-slate-400" x-text="lang === 'zh' ? '默认货币' : 'Currency'"></p>
                <p class="text-2xl font-bold text-slate-200 mt-1">MYR</p>
            </div>
        </div>

        <!-- 录入与操作区 -->
        <div class="bg-slate-800 border border-slate-700 p-5 rounded-xl shadow">
            <h2 class="text-sm font-semibold mb-4 text-slate-200 flex items-center gap-2">
                ➕ <span x-text="lang === 'zh' ? '添加新行政开支记录 (Master Listing 录入)' : 'Add New Expense Record'"></span>
            </h2>
            <form @submit.prevent="addExpense" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-3 text-sm">
                <div>
                    <label class="block text-xs text-slate-400 mb-1">Month</label>
                    <select x-model="form.month" class="w-full bg-slate-700 border border-slate-600 rounded px-2.5 py-1.5 text-slate-200">
                        <option>January</option><option>February</option><option>March</option><option>April</option>
                        <option>May</option><option>June</option><option>July</option><option>August</option>
                        <option>September</option><option>October</option><option>November</option><option>December</option>
                    </select>
                </div>
                <div>
                    <label class="block text-xs text-slate-400 mb-1">Building</label>
                    <input type="text" x-model="form.building" placeholder="例如: The Bousteador" class="w-full bg-slate-700 border border-slate-600 rounded px-2.5 py-1.5 text-slate-200" required>
                </div>
                <div>
                    <label class="block text-xs text-slate-400 mb-1">Office/Unit</label>
                    <input type="text" x-model="form.unit" placeholder="例如: 8.4" class="w-full bg-slate-700 border border-slate-600 rounded px-2.5 py-1.5 text-slate-200" required>
                </div>
                <div>
                    <label class="block text-xs text-slate-400 mb-1">Invoice Date</label>
                    <input type="date" x-model="form.invoiceDate" class="w-full bg-slate-700 border border-slate-600 rounded px-2.5 py-1.5 text-slate-200">
                </div>
                <div>
                    <label class="block text-xs text-slate-400 mb-1">Dingtalk Submission Date</label>
                    <input type="date" x-model="form.subDate" class="w-full bg-slate-700 border border-slate-600 rounded px-2.5 py-1.5 text-slate-200">
                </div>
                <div>
                    <label class="block text-xs text-slate-400 mb-1">Description</label>
                    <input type="text" x-model="form.desc" @input="autoCategorize" placeholder="输入描述自动分类" class="w-full bg-slate-700 border border-slate-600 rounded px-2.5 py-1.5 text-slate-200" required>
                </div>
                <div>
                    <label class="block text-xs text-slate-400 mb-1">Payable Name</label>
                    <input type="text" x-model="form.payable" placeholder="供应商名称" class="w-full bg-slate-700 border border-slate-600 rounded px-2.5 py-1.5 text-slate-200" required>
                </div>
                <div>
                    <label class="block text-xs text-slate-400 mb-1">Invoice No.</label>
                    <input type="text" x-model="form.invoiceNo" placeholder="发票号" class="w-full bg-slate-700 border border-slate-600 rounded px-2.5 py-1.5 text-slate-200">
                </div>
                <div>
                    <label class="block text-xs text-slate-400 mb-1">Payment Mode</label>
                    <input type="text" x-model="form.payMode" placeholder="例如: Payment Application" class="w-full bg-slate-700 border border-slate-600 rounded px-2.5 py-1.5 text-slate-200">
                </div>
                <div>
                    <label class="block text-xs text-slate-400 mb-1">Expenses Category (自动匹配)</label>
                    <select x-model="form.category" class="w-full bg-slate-700 border border-slate-600 rounded px-2.5 py-1.5 text-slate-200">
                        <template x-for="cat in categoryList" :key="cat">
                            <option :value="cat" x-text="cat"></option>
                        </template>
                    </select>
                </div>
                <div>
                    <label class="block text-xs text-slate-400 mb-1">Amount (MYR)</label>
                    <input type="number" step="0.01" x-model.number="form.amount" placeholder="0.00" class="w-full bg-slate-700 border border-slate-600 rounded px-2.5 py-1.5 text-slate-200" required>
                </div>
                <div>
                    <label class="block text-xs text-slate-400 mb-1">Remark</label>
                    <input type="text" x-model="form.remark" placeholder="备注" class="w-full bg-slate-700 border border-slate-600 rounded px-2.5 py-1.5 text-slate-200">
                </div>
                <div class="sm:col-span-2 lg:col-span-4 flex justify-end mt-2">
                    <button type="submit" class="bg-indigo-600 hover:bg-indigo-700 text-white font-medium px-6 py-2 rounded-lg text-sm transition shadow">
                        💾 <span x-text="lang === 'zh' ? '保存并自动按日期排序' : 'Save & Auto-Sort'"></span>
                    </button>
                </div>
            </form>
        </div>

        <!-- Master Listing 表格区 -->
        <div class="bg-slate-800 border border-slate-700 rounded-xl shadow overflow-hidden">
            <div class="p-4 border-b border-slate-700 flex justify-between items-center">
                <h3 class="font-semibold text-slate-200 text-sm">
                    📋 <span x-text="currentCompany + ' - Master Listing (按 Invoice Date 从早到晚自动排列)'"></span>
                </h3>
                <span class="text-xs text-slate-400" x-text="lang === 'zh' ? '金额已统一转换为 MYR' : 'Currency in MYR'"></span>
            </div>
            
            <div class="overflow-x-auto">
                <table class="w-full text-left border-collapse text-xs">
                    <thead>
                        <tr class="bg-slate-700/50 text-slate-400 border-b border-slate-700">
                            <th class="p-2.5">Month</th>
                            <th class="p-2.5">Building</th>
                            <th class="p-2.5">Office/Unit</th>
                            <th class="p-2.5">Invoice Date</th>
                            <th class="p-2.5">Dingtalk Sub. Date</th>
                            <th class="p-2.5">Description</th>
                            <th class="p-2.5">Payable Name</th>
                            <th class="p-2.5">Invoice No.</th>
                            <th class="p-2.5">Payment Mode</th>
                            <th class="p-2.5">Expenses Category</th>
                            <th class="p-2.5 text-right">Amount (MYR)</th>
                            <th class="p-2.5">Remark</th>
                            <th class="p-2.5 text-center">Action</th>
                        </tr>
                    </thead>
                    <tbody class="divide-y divide-slate-700/50">
                        <template x-for="(item, index) in sortedExpenses" :key="index">
                            <tr class="hover:bg-slate-700/25 transition">
                                <td class="p-2.5" x-text="item.month"></td>
                                <td class="p-2.5" x-text="item.building"></td>
                                <td class="p-2.5" x-text="item.unit"></td>
                                <td class="p-2.5 font-mono" x-text="item.invoiceDate || '待核实'" :class="{'text-amber-400 font-bold': !item.invoiceDate}"></td>
                                <td class="p-2.5 font-mono" x-text="item.subDate || '-'"></td>
                                <td class="p-2.5 font-medium text-slate-200" x-text="item.desc"></td>
                                <td class="p-2.5" x-text="item.payable"></td>
                                <td class="p-2.5 font-mono text-slate-400" x-text="item.invoiceNo || '-'"></td>
                                <td class="p-2.5" x-text="item.payMode"></td>
                                <td class="p-2.5">
                                    <span class="bg-indigo-950 text-indigo-300 border border-indigo-800 px-2 py-0.5 rounded text-[11px]" x-text="item.category"></span>
                                </td>
                                <td class="p-2.5 text-right font-mono font-semibold" :class="{'text-red-400 font-bold': !item.amount && item.amount !== 0}" x-text="item.amount !== undefined && item.amount !== '' ? 'MYR ' + Number(item.amount).toFixed(2) : '待核实'"></td>
                                <td class="p-2.5 text-slate-400" x-text="item.remark || '-'"></td>
                                <td class="p-2.5 text-center">
                                    <button @click="deleteItem(index)" class="text-red-400 hover:text-red-300 text-xs px-2 py-1 rounded bg-red-950/40 border border-red-900/50">删除</button>
                                </td>
                            </tr>
                        </template>
                        <template x-if="sortedExpenses.length === 0">
                            <tr>
                                <td colspan="13" class="text-center py-8 text-slate-500">
                                    <span x-text="lang === 'zh' ? '暂无账单记录，请在上方向该实体添加新开支。' : 'No records found.'"></span>
                                </td>
                            </tr>
                        </template>
                    </tbody>
                </table>
            </div>
        </div>

    </main>

    <!-- 核心逻辑脚本 -->
    <script>
        function expenseCenter() {
            return {
                lang: 'zh',
                currentCompany: 'BKBP',
                categoryList: [
                    'Office rental', 'Office Water', 'Office Electricity', 'Office Indah Water',
                    'Office Internet', 'Office Telephone Line', 'Office Cleaning Service',
                    'Office Water Filter/Coway', 'Office Refreshment', 'Office Equipment', 'Office Supplies'
                ],
                form: {
                    month: 'August', building: '', unit: '', invoiceDate: '', subDate: '',
                    desc: '', payable: '', invoiceNo: '', payMode: 'Payment Application',
                    category: 'Office Supplies', amount: '', remark: ''
                },
                // 模拟多公司数据库
                database: {
                    'BKBP': [
                        { month: 'August', building: 'Padang Victoria', unit: '35', invoiceDate: '2026-08-05', subDate: '2026-08-10', desc: 'Office Rental - 35 Jalan Padang Victoria', payable: 'Crossover Capital', invoiceNo: '-', payMode: 'Finance', category: 'Office rental', amount: 3500.00, remark: '' },
                        { month: 'August', building: 'Imazium', unit: '24', invoiceDate: '2026-08-12', subDate: '2026-08-15', desc: 'Office Internet Subscription', payable: 'Maxis Broadband', invoiceNo: '77212', payMode: 'Payment Application', category: 'Office Internet', amount: 316.95, remark: '' }
                    ],
                    'BSO': [
                        { month: 'August', building: 'Imazium', unit: '24.1', invoiceDate: '2026-08-01', subDate: '2026-08-05', desc: 'Office rental charges', payable: 'Damansara Uptown Holdings', invoiceNo: '11026', payMode: 'Urgent Payment', category: 'Office rental', amount: 40000.00, remark: '' }
                    ],
                    'BRIC': [
                        { month: 'July', building: 'Padang Victoria', unit: '41', invoiceDate: '2026-07-02', subDate: '', desc: 'Office Rental - 41 Jalan Padang Victoria', payable: 'Crossover Capital', invoiceNo: '-', payMode: 'Finance', category: 'Office rental', amount: 4000.00, remark: '' }
                    ],
                    'BSPD': [
                        { month: 'January', building: 'The Bousteador', unit: '8.4', invoiceDate: '2026-01-12', subDate: '2026-01-19', desc: 'Monthly office cleaning expenses - Jan 26', payable: 'Build-Clean Sdn Bhd', invoiceNo: 'IV-113642', payMode: 'Payment Application', category: 'Office Cleaning Service', amount: 1458.00, remark: '' }
                    ]
                },
                get filteredExpenses() {
                    return this.database[this.currentCompany] || [];
                },
                // 核心规则 2：按 Invoice Date 从早到晚排列；日期缺失排在最后
                get sortedExpenses() {
                    return [...this.filteredExpenses].sort((a, b) => {
                        if (!a.invoiceDate && !b.invoiceDate) return 0;
                        if (!a.invoiceDate) return 1; // 缺失排最后
                        if (!b.invoiceDate) return -1;
                        return new Date(a.invoiceDate) - new Date(b.invoiceDate);
                    });
                },
                get totalAmountFormatted() {
                    let total = this.filteredExpenses.reduce((sum, item) => sum + (Number(item.amount) || 0), 0);
                    return 'MYR ' + total.toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
                },
                get pendingVerifyCount() {
                    return this.filteredExpenses.filter(item => !item.invoiceDate || item.amount === '' || item.amount === undefined).length;
                },
                // 核心规则 5：智能模糊匹配 Category
                autoCategorize() {
                    let text = this.form.desc.toLowerCase();
                    if (text.includes('rent')) this.form.category = 'Office rental';
                    else if (text.includes('water')) this.form.category = 'Office Water';
                    else if (text.includes('electric') || text.includes('tnb')) this.form.category = 'Office Electricity';
                    else if (text.includes('internet') || text.includes('maxis')) this.form.category = 'Office Internet';
                    else if (text.includes('clean')) this.form.category = 'Office Cleaning Service';
                    else if (text.includes('coway') || text.includes('filter')) this.form.category = 'Office Water Filter/Coway';
                },
                addExpense() {
                    // 核心规则 3：关键信息缺失标注“待核实”
                    let newItem = {
                        month: this.form.month,
                        building: this.form.building || '待核实',
                        unit: this.form.unit || '待核实',
                        invoiceDate: this.form.invoiceDate || '', // 允许为空，自动沉底
                        subDate: this.form.subDate || '',
                        desc: this.form.desc || '待核实',
                        payable: this.form.payable || '待核实',
                        invoiceNo: this.form.invoiceNo || '',
                        payMode: this.form.payMode || 'Payment Application',
                        category: this.form.category,
                        amount: this.form.amount !== '' ? Number(this.form.amount) : '',
                        remark: this.form.remark
                    };

                    if (!this.database[this.currentCompany]) {
                        this.database[this.currentCompany] = [];
                    }
                    this.database[this.currentCompany].push(newItem);

                    // 清空表单
                    this.form.building = '';
                    this.form.unit = '';
                    this.form.invoiceDate = '';
                    this.form.subDate = '';
                    this.form.desc = '';
                    this.form.payable = '';
                    this.form.invoiceNo = '';
                    this.form.amount = '';
                    this.form.remark = '';
                },
                deleteItem(index) {
                    // 对应 sorted 之后的真实索引
                    let target = this.sortedExpenses[index];
                    let realIndex = this.database[this.currentCompany].indexOf(target);
                    if (realIndex > -1) {
                        this.database[this.currentCompany].splice(realIndex, 1);
                    }
                }
            }
        }
    </script>
</body>
</html>
